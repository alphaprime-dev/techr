name: Polars Release

on:
  push:
    branches:
      - main
    paths:
      - "polars/Cargo.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("polars/Cargo.toml").read_text())
          print(f"polars-v{cargo['package']['version']}")
          PY
          )"

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    if: needs.prepare.outputs.release_needed == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            artifact: wheels-linux-x86_64
            runner: ubuntu-latest
          - target: aarch64
            artifact: wheels-linux-aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: polars
          maturin-version: v1.13.1
          target: ${{ matrix.target }}
          manylinux: "2014"
          sccache: "true"
          args: --release --out dist -i python3.10

      - name: Check artifact contents
        run: python polars/scripts/check_artifacts.py polars/dist

      - name: Smoke test x86_64 wheel
        if: matrix.target == 'x86_64'
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path('polars/dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve().as_posix())
          PY
          )"
          uv run --isolated --python 3.10 --with "$wheel" python polars/scripts/smoke_import.py

      - name: Smoke test aarch64 wheel
        if: matrix.target == 'aarch64'
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path('polars/dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve().as_posix())
          PY
          )"
          uv run --isolated --python 3.10 --with "$wheel" python polars/scripts/smoke_import.py

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: polars/dist/*

  build-macos:
    if: needs.prepare.outputs.release_needed == 'true'
    needs: prepare
    runs-on: macos-14
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v8.0.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build universal2 wheel
        uses: PyO3/maturin-action@v1
        env:
          ARCHFLAGS: "-arch x86_64 -arch arm64"
        with:
          working-directory: polars
          maturin-version: v1.13.1
          sccache: "true"
          args: --release --out dist

      - name: Check artifact contents
        run: python polars/scripts/check_artifacts.py polars/dist

      - name: Smoke test built wheel
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path('polars/dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve().as_posix())
          PY
          )"
          uv run --isolated --python 3.10 --with "$wheel" python polars/scripts/smoke_import.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-universal2
          path: polars/dist/*

  build-windows:
    if: needs.prepare.outputs.release_needed == 'true'
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          architecture: "x64"
      - uses: astral-sh/setup-uv@v8.0.0
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: polars
          maturin-version: v1.13.1
          target: x86_64-pc-windows-msvc
          sccache: "true"
          args: --release --out dist

      - name: Check artifact contents
        run: python polars/scripts/check_artifacts.py polars/dist

      - name: Smoke test built wheel
        run: |
          wheel="$(python - <<'PY'
          from pathlib import Path

          wheels = sorted(Path('polars/dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f"expected exactly one wheel, found {len(wheels)}")
          print(wheels[0].resolve().as_posix())
          PY
          )"
          uv run --isolated --python 3.10 --with "$wheel" python polars/scripts/smoke_import.py

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x64
          path: polars/dist/*

  build-sdist:
    if: needs.prepare.outputs.release_needed == 'true'
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: polars
          maturin-version: v1.13.1
          command: sdist
          args: --out dist

      - name: Check artifact contents
        run: python polars/scripts/check_artifacts.py polars/dist

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: polars/dist/*

  publish-pypi:
    if: needs.prepare.outputs.release_needed == 'true'
    needs: [prepare, build-linux, build-macos, build-windows, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true

  create-release:
    if: needs.prepare.outputs.release_needed == 'true'
    needs: [prepare, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
